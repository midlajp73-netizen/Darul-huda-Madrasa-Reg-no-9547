<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madrasa Result</title>

<link rel="stylesheet" href="style.css">

<!-- PDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<!-- 🔍 Search Box -->
<div class="search-box" style="text-align:center; margin:20px;">
  <input type="text" id="admNo" placeholder="Enter Admission No" style="padding:10px; width:200px;">
  <button onclick="searchResult()" style="padding:10px;">🔍 Search</button>
</div>

<!-- 📄 Result Sheet -->
<div class="sheet" id="resultBox">

  <!-- Header -->
  <div class="top-header">
    <h2>دار الهدى مدرسة، بونور</h2>
    <p>Darul Huda Madrasa, Poonoor</p>
    <h3>EXAMINATION RESULT</h3>
  </div>

  <!-- Default Message -->
  <p style="text-align:center; margin-top:30px;">
    Enter Admission Number to View Result
  </p>

</div>

<!-- 🔘 Buttons -->
<div class="btns" style="text-align:center; margin:20px;">
  <button onclick="printResult()">🖨 Print</button>
  <button onclick="downloadPDF()">📥 Download PDF</button>
</div>

<!-- 📥 PDF Script -->
<script>
function downloadPDF() {
  const element = document.getElementById("resultBox");
  html2pdf().set({
    margin: 5,
    filename: 'Madrasa_Result.pdf',
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(element).save();
}
</script>

<!-- ⚙ Main Script -->
<script src="script.js"></script>

</body>
</html>
